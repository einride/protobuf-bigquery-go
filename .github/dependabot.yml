version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-dependencies:
        patterns:
          - "*"

    cooldown:
      default-days: 7
      exclude:
        - github.com/einride/*
        - github.com/einride-autonomous/*
        - github.com/einride-labs/*
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      root-go-dependencies:
        patterns:
          - "*"

    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - github.com/einride/*
        - github.com/einride-autonomous/*
        - github.com/einride-labs/*
  - package-ecosystem: gomod
    directory: .sage
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      sage-go-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - github.com/einride/*
        - github.com/einride-autonomous/*
        - github.com/einride-labs/*
